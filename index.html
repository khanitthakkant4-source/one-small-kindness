<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D9F3F0">
  <meta name="description" content="One Small Kindness: ดูแลตัวเองวันละนิด ให้ใจค่อย ๆ เติบโต">
  <title>One Small Kindness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/plant-1.svg" type="image/svg+xml">
</head>
<body>
  <!-- iPhone 18 Pro Max mockup (desktop only): 440×956 pt screen, 78 × 163.4 mm body → 470×986 pt.
       On a real phone the frame disappears and the app fills the screen. -->
  <div class="phone-wrap" id="phoneWrap">
  <div class="phone" id="phone">
    <span class="hw hw--action" aria-hidden="true"></span>
    <span class="hw hw--vol-up" aria-hidden="true"></span>
    <span class="hw hw--vol-down" aria-hidden="true"></span>
    <span class="hw hw--side" aria-hidden="true"></span>
    <span class="hw hw--camera" aria-hidden="true"></span>
  <div class="device" id="device">
    <div class="island" aria-hidden="true"></div>
    <div class="home-indicator" aria-hidden="true"></div>
    <div class="statusbar" aria-hidden="true">
      <span class="statusbar__time">9:41</span>
      <svg class="statusbar__icons" width="77" height="14" viewBox="0 0 66 12" fill="currentColor">
        <rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="6" width="3" height="6" rx="1"/>
        <rect x="9" y="3.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="1" width="3" height="11" rx="1"/>
        <path d="M30 3.2a8.6 8.6 0 0 1 6 2.4l1.2-1.2A10.3 10.3 0 0 0 30 1.5a10.3 10.3 0 0 0-7.2 2.9L24 5.6a8.6 8.6 0 0 1 6-2.4Zm0 3.3c1.3 0 2.5.5 3.5 1.4l1.2-1.2A6.6 6.6 0 0 0 30 4.8a6.6 6.6 0 0 0-4.7 1.9l1.2 1.2a5 5 0 0 1 3.5-1.4Zm0 3.2a1.7 1.7 0 0 0-1.2.5L30 11.4l1.2-1.2a1.7 1.7 0 0 0-1.2-.5Z"/>
        <rect x="41.5" y=".5" width="21" height="11" rx="3.2" fill="none" stroke="currentColor" opacity=".4"/>
        <rect x="43.5" y="2.5" width="17" height="7" rx="1.6"/><path d="M64 4.2v3.6a1.9 1.9 0 0 0 0-3.6Z" opacity=".4"/>
      </svg>
    </div>

    <header class="topbar">
      <p class="brand">One Small Kindness</p>
      <div class="progress" id="progress" role="progressbar" aria-label="ความคืบหน้า" aria-valuemin="1" aria-valuemax="4" hidden>
        <span></span><span></span><span></span><span></span>
      </div>
    </header>

    <main id="screen" class="screen"></main>

    <div id="toast" class="toast" role="alert" hidden></div>
    <p id="live" class="sr-only" aria-live="polite"></p>
  </div>
  </div>
  </div>

  <aside class="demo" id="demo" aria-label="แผงทดสอบ">
    <button class="demo__toggle" id="demoToggle" type="button" aria-expanded="false" aria-controls="demoBody">ทดสอบ</button>
    <div class="demo__body" id="demoBody">
      <p class="demo__title">สำหรับผู้ทดสอบ</p>
      <p class="demo__hint">ลองเคสต่าง ๆ ได้โดยไม่ต้องรอวันจริง</p>
      <dl class="demo__state" id="demoState"></dl>
      <label class="demo__check"><input type="checkbox" id="demoFast"> เร่งเวลาจับเวลา (6 วินาที)</label>
      <button type="button" data-demo="nextDay">ข้ามไปวันถัดไป</button>
      <button type="button" data-demo="skipDays">จำลองว่าหายไป 3 วัน</button>
      <button type="button" data-demo="day6">จำลองว่าทำมาแล้ว 6 วัน</button>
      <button type="button" data-demo="failSave">จำลองบันทึกไม่สำเร็จ (ครั้งถัดไป)</button>
      <button type="button" data-demo="reset" class="demo__danger">ล้างข้อมูลทั้งหมด</button>
    </div>
  </aside>

  <script src="assets/inline.js"></script>
  <script src="assets/heroes.js"></script>
  <script src="app.js"></script>
</body>
</html>
